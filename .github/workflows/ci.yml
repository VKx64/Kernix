name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Find Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  extension:
    name: Browser companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  repository:
    name: Repository configuration
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-configuration-only
      LEGACY_ADMIN_PASSWORD: ci-legacy-configuration-only
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.legacy.yaml config --quiet
      - name: Check legacy PHP syntax
        run: |
          php -l legacy/index.php
          find legacy/app legacy/modules legacy/views -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check container entrypoint syntax
        run: |
          sh -n backend/docker/entrypoint.sh
          sh -n legacy/docker/legacy/entrypoint.sh
