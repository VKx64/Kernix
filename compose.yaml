# Retained for compatibility with existing Kernix volumes and local data.
name: ${COMPOSE_PROJECT_NAME:-production-management-v2}

x-backend-worker: &backend-worker
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    APP_NAME: ${APP_NAME:-Kernix}
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: ${APP_KEY:-}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: http://localhost:${BACKEND_PORT:-8000}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
    FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_NAME:-production_v2}
    DB_USERNAME: ${DB_USER:-production_v2_user}
    DB_PASSWORD: ${DB_PASSWORD:-production_v2_local_password}
    CACHE_STORE: file
    QUEUE_CONNECTION: database
    # The queue worker is what actually sends WhatsApp messages, so it needs the
    # bridge address and secret as much as the API does.
    WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp:8790}
    WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-kernix-local-whatsapp-bridge-secret}
    WHATSAPP_TRIGGER: ${WHATSAPP_TRIGGER:-kernix}
    WHATSAPP_COUNTRY_CODE: ${WHATSAPP_COUNTRY_CODE:-63}
    WHATSAPP_ACTOR_USER_ID: ${WHATSAPP_ACTOR_USER_ID:-}
    RUN_MIGRATIONS: "false"
    RUN_SEEDERS: "false"
  depends_on:
    backend:
      condition: service_healthy
  volumes:
    - backend_storage:/var/www/html/storage

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Kernix}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME:-production_v2}
      DB_USERNAME: ${DB_USER:-production_v2_user}
      DB_PASSWORD: ${DB_PASSWORD:-production_v2_local_password}
      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-480}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp:8790}
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-kernix-local-whatsapp-bridge-secret}
      WHATSAPP_TRIGGER: ${WHATSAPP_TRIGGER:-kernix}
      WHATSAPP_COUNTRY_CODE: ${WHATSAPP_COUNTRY_CODE:-63}
      WHATSAPP_ACTOR_USER_ID: ${WHATSAPP_ACTOR_USER_ID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (minimum 12 characters)}
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  queue:
    <<: *backend-worker
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=90", "--sleep=2"]
    healthcheck:
      disable: true

  scheduler:
    <<: *backend-worker
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    environment:
      # Container-to-container, so this is the service name rather than the
      # published host port.
      KERNIX_BASE_URL: http://backend:8000
      KERNIX_MCP_HOSTED: "1"
      KERNIX_MCP_HOST: 0.0.0.0
      KERNIX_MCP_PORT: 8765
      KERNIX_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://127.0.0.1:8765}
      # Where a browser reaches the app, for the sign-in a connector sends
      # somebody through. The API address above is no use here — it is the
      # container's, and the browser is not in the container.
      KERNIX_APP_URL: ${MCP_APP_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      # Fixed rather than random so a registered connector survives a restart.
      # Any long string will do locally; production uses its own.
      KERNIX_MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:-kernix-local-assistant-sign-in-secret}
      KERNIX_ALLOW_WRITES: ${MCP_ALLOW_WRITES:-1}
      KERNIX_ADMIN_OVERRIDE: ${MCP_ADMIN_OVERRIDE:-0}
    depends_on:
      backend:
        condition: service_healthy

  # The linked WhatsApp account lives here and nowhere else. It is not published
  # to the host: the API and the queue worker reach it over the Compose network,
  # and nothing outside the stack has any business talking to it.
  #
  # This connects a real WhatsApp account through an unofficial client. WhatsApp
  # does not sanction that, and an account it flags can be banned. Link a number
  # you are willing to lose, not the company's only one.
  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KERNIX_WHATSAPP_HOST: 0.0.0.0
      KERNIX_WHATSAPP_PORT: 8790
      KERNIX_WHATSAPP_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-kernix-local-whatsapp-bridge-secret}
      KERNIX_WHATSAPP_AUTH_DIR: /app/auth
      # Container-to-container: the bridge posts each inbound message to the API.
      KERNIX_BASE_URL: http://backend:8000
      # Shown in WhatsApp's own "linked devices" list on the phone.
      KERNIX_WHATSAPP_DEVICE_NAME: ${WHATSAPP_DEVICE_NAME:-Kernix}
      KERNIX_WHATSAPP_LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-warn}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # The WhatsApp session. Lose this volume and the QR has to be scanned
      # again; deleting it is how an account is force-unlinked.
      - whatsapp_auth:/app/auth

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-production_v2}
      MYSQL_USER: ${DB_USER:-production_v2_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-production_v2_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-production_v2_root_password}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  backend_storage:
  mysql_data:
  whatsapp_auth:
